<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rey's social preview</title>
    <style>
      @font-face {
        font-family: Archivo;
        src: url('../node_modules/@fontsource-variable/archivo/files/archivo-latin-wght-normal.woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #fff;
        color: #151b20;
        font-family: Archivo, Arial, sans-serif;
        overflow: hidden;
        position: relative;
      }
      main {
        padding: 54px 60px;
        width: 760px;
        height: 100%;
        position: relative;
        z-index: 1;
        background: white;
      }
      .logo {
        font-weight: 900;
        font-style: italic;
        font-size: 40px;
        letter-spacing: -3px;
        line-height: 1;
      }
      .logo span {
        color: #c8102e;
      }
      .logo small {
        display: block;
        font-size: 9px;
        letter-spacing: 3px;
        font-style: normal;
        margin-top: 7px;
      }
      .eyebrow {
        font-weight: 750;
        font-size: 12px;
        letter-spacing: 2px;
        color: #c8102e;
        margin-top: 42px;
      }
      h1 {
        font-size: 78px;
        line-height: 0.96;
        letter-spacing: -4px;
        margin: 16px 0 28px;
        font-weight: 900;
      }
      h1 span {
        color: #c8102e;
      }
      .details {
        border-top: 1px solid #ddd;
        padding-top: 22px;
        font-size: 17px;
        line-height: 1.7;
      }
      .details strong {
        font-size: 22px;
      }
      img {
        position: absolute;
        right: 0;
        top: 0;
        width: 440px;
        height: 630px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <img src="../src/assets/editorial/porsche-red.jpg" alt="" />
    <main>
      <div class="logo">REY’S<span>/</span><small>AUTO REPAIR</small></div>
      <p class="eyebrow">LITTLE HAVANA / MIAMI</p>
      <h1>
        YOUR CAR.<br /><span>IN GOOD<br />HANDS.</span>
      </h1>
      <div class="details"><strong>(305) 541-7339</strong><br />527 SW 15th Ave · Miami, FL</div>
    </main>
  </body>
</html>
